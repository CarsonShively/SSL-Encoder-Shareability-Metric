[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ssl_shareability_metric"
version = "0.1.0"
requires-python = ">=3.11, <3.14"

dependencies = [
    "pandas>=2.2,<3",
    "scikit-learn>=1.7,<1.9",
    "numpy>=1.26,<3",
    "torch>=2.7,<3",
    "ipykernel>=7,<8"
]

[tool.setuptools.packages.find]
where = ["src"]